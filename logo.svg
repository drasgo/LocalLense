<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#f0f9ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring / lens frame -->
  <circle cx="52" cy="52" r="38" stroke="url(#lensGrad)" stroke-width="6" fill="none"/>
  
  <!-- Glass interior -->
  <circle cx="52" cy="52" r="32" fill="url(#glassGrad)"/>
  
  <!-- Lens reflection highlight -->
  <ellipse cx="40" cy="40" rx="12" ry="8" fill="white" opacity="0.5" transform="rotate(-30 40 40)"/>
  
  <!-- Handle -->
  <rect x="78" y="78" width="12" height="32" rx="6" fill="url(#lensGrad)" transform="rotate(45 84 94)"/>
  
  <!-- AI circuit pattern inside lens -->
  <g stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="52" cy="52" r="4" fill="#0ea5e9"/>
    
    <!-- Connected nodes -->
    <circle cx="38" cy="40" r="2.5" fill="#a855f7"/>
    <circle cx="66" cy="40" r="2.5" fill="#a855f7"/>
    <circle cx="38" cy="64" r="2.5" fill="#a855f7"/>
    <circle cx="66" cy="64" r="2.5" fill="#a855f7"/>
    <circle cx="52" cy="32" r="2.5" fill="#0ea5e9"/>
    <circle cx="52" cy="72" r="2.5" fill="#0ea5e9"/>
    
    <!-- Connection lines -->
    <line x1="52" y1="52" x2="38" y2="40"/>
    <line x1="52" y1="52" x2="66" y2="40"/>
    <line x1="52" y1="52" x2="38" y2="64"/>
    <line x1="52" y1="52" x2="66" y2="64"/>
    <line x1="52" y1="52" x2="52" y2="32"/>
    <line x1="52" y1="52" x2="52" y2="72"/>
    
    <!-- Outer connections -->
    <line x1="38" y1="40" x2="52" y2="32"/>
    <line x1="66" y1="40" x2="52" y2="32"/>
    <line x1="38" y1="64" x2="52" y2="72"/>
    <line x1="66" y1="64" x2="52" y2="72"/>
  </g>
  
  <!-- Privacy shield indicator (small) -->
  <g transform="translate(70, 18)">
    <path d="M10 2 L18 6 L18 12 C18 18 10 22 10 22 C10 22 2 18 2 12 L2 6 Z" 
          fill="url(#lensGrad)" stroke="white" stroke-width="1.5"/>
    <path d="M7 11 L9 13 L14 8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

