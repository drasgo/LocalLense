<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Resolution 2x Upscale Test</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        .container { display: flex; gap: 40px; flex-wrap: wrap; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .box h3 { margin-top: 0; color: #666; }
        canvas, img { border: 2px solid #ddd; border-radius: 8px; background: #eee; }
        .dimensions { font-size: 18px; font-weight: bold; color: #0ea5e9; margin-top: 10px; }
        #status { margin: 20px 0; padding: 16px; border-radius: 8px; font-weight: 500; }
        #status.loading { background: #fef3c7; color: #92400e; }
        #status.success { background: #d1fae5; color: #065f46; }
        #status.error { background: #fee2e2; color: #991b1b; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; 
                   border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>🔍 Super-Resolution 4x Upscale Test (RLFN)</h1>
    <div id="status" class="loading"><span class="spinner"></span>Loading model...</div>
    
    <div class="container">
        <div class="box">
            <h3>Input Image</h3>
            <canvas id="inputCanvas"></canvas>
            <div class="dimensions" id="inputDims">-</div>
        </div>
        <div class="box">
            <h3>Output Image (should be 2x larger)</h3>
            <canvas id="outputCanvas"></canvas>
            <div class="dimensions" id="outputDims">-</div>
        </div>
    </div>

    <script>
        const MODEL_URL = "./models/super_res.onnx?" + Date.now(); // Cache bust
        const INPUT_SIZE = 100; // Test with 100x100 input

        async function imageToTensor(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const imageData = ctx.getImageData(0, 0, w, h);
            const { data } = imageData;
            const tensorData = new Float32Array(1 * 3 * h * w);
            
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const pixelIdx = (y * w + x) * 4;
                    const tensorIdx = y * w + x;
                    tensorData[0 * h * w + tensorIdx] = data[pixelIdx + 0] / 255.0;
                    tensorData[1 * h * w + tensorIdx] = data[pixelIdx + 1] / 255.0;
                    tensorData[2 * h * w + tensorIdx] = data[pixelIdx + 2] / 255.0;
                }
            }
            return new ort.Tensor('float32', tensorData, [1, 3, h, w]);
        }

        function tensorToCanvas(tensor, canvas) {
            const [batch, channels, h, w] = tensor.dims;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(w, h);
            const pixels = imageData.data;
            const data = tensor.data;
            const channelSize = h * w;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const tensorIdx = y * w + x;
                    const pixelIdx = tensorIdx * 4;
                    pixels[pixelIdx + 0] = Math.max(0, Math.min(255, Math.round(data[0 * channelSize + tensorIdx] * 255)));
                    pixels[pixelIdx + 1] = Math.max(0, Math.min(255, Math.round(data[1 * channelSize + tensorIdx] * 255)));
                    pixels[pixelIdx + 2] = Math.max(0, Math.min(255, Math.round(data[2 * channelSize + tensorIdx] * 255)));
                    pixels[pixelIdx + 3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        async function runTest() {
            const statusEl = document.getElementById('status');
            const inputCanvas = document.getElementById('inputCanvas');
            const outputCanvas = document.getElementById('outputCanvas');
            const inputDims = document.getElementById('inputDims');
            const outputDims = document.getElementById('outputDims');

            try {
                // Create test image (colorful gradient)
                inputCanvas.width = INPUT_SIZE;
                inputCanvas.height = INPUT_SIZE;
                const ctx = inputCanvas.getContext('2d');
                
                // Draw gradient
                for (let y = 0; y < INPUT_SIZE; y++) {
                    for (let x = 0; x < INPUT_SIZE; x++) {
                        ctx.fillStyle = `rgb(${x * 2.55}, ${y * 2.55}, ${128 + Math.sin(x/10) * 50})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                inputDims.textContent = `${INPUT_SIZE} × ${INPUT_SIZE} px`;

                // Load model
                statusEl.innerHTML = '<span class="spinner"></span>Loading ONNX model...';
                console.log('Loading model from:', MODEL_URL);
                
                const session = await ort.InferenceSession.create(MODEL_URL, {
                    executionProviders: ['wasm']
                });
                console.log('Model loaded. Input names:', session.inputNames, 'Output names:', session.outputNames);

                // Run inference
                statusEl.innerHTML = '<span class="spinner"></span>Running inference...';
                const inputTensor = await imageToTensor(inputCanvas);
                console.log('Input tensor shape:', inputTensor.dims);

                const feeds = { [session.inputNames[0]]: inputTensor };
                const results = await session.run(feeds);
                
                const outputTensor = results[session.outputNames[0]];
                console.log('Output tensor shape:', outputTensor.dims);

                // Draw output
                tensorToCanvas(outputTensor, outputCanvas);
                const [b, c, outH, outW] = outputTensor.dims;
                outputDims.textContent = `${outW} × ${outH} px`;

                // Check if 4x upscaled (RLFN model)
                const upscaleFactor = outH / INPUT_SIZE;
                if (upscaleFactor === 4) {
                    statusEl.className = 'success';
                    statusEl.innerHTML = `✅ SUCCESS! Model correctly upscales ${INPUT_SIZE}×${INPUT_SIZE} → ${outW}×${outH} (4x)`;
                } else if (upscaleFactor === 2) {
                    statusEl.className = 'success';
                    statusEl.innerHTML = `✅ Model upscales ${INPUT_SIZE}×${INPUT_SIZE} → ${outW}×${outH} (2x)`;
                } else {
                    statusEl.className = 'error';
                    statusEl.innerHTML = `❌ Unexpected scale: ${INPUT_SIZE}×${INPUT_SIZE} → ${outW}×${outH} (${upscaleFactor}x)`;
                }

            } catch (e) {
                console.error('Error:', e);
                statusEl.className = 'error';
                statusEl.innerHTML = `❌ Error: ${e.message}`;
            }
        }

        runTest();
    </script>
</body>
</html>
